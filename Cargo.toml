[package]
name = "znnz-agent-launcher"
version = "1.1.0"
edition = "2024"
description = "Windows launcher for Codex and Claude clients with znnz.net and custom AI gateways"
license = "Apache-2.0"
readme = "README.md"
keywords = ["codex", "claude", "ai-gateway", "launcher"]
categories = ["development-tools"]

[[bin]]
name = "znnz-agent-launcher"
path = "src/main.rs"

[features]
default = ["renderer-wgpu"]
renderer-glow = ["eframe/glow"]
renderer-wgpu = ["eframe/wgpu"]

[dependencies]
base64 = "0.22"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
eframe = { version = "0.35.0", default-features = false, features = ["default_fonts"] }
futures-util = "0.3"
bytes = "1"
http = "1"
http-body-util = "0.1"
resvg = { version = "0.47", default-features = false }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2", "stream"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "sync", "time", "signal", "process"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
toml_edit = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
winreg = "0.55"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Networking_WinHttp",
  "Win32_Security_Cryptography",
  "Win32_Security_WinTrust",
  "Win32_Storage_FileSystem",
  "Win32_Storage_Packaging_Appx",
  "Win32_System_Com",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging"
] }


[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "z"
panic = "abort"
strip = "symbols"

[build-dependencies]
winresource = "0.1"


